<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instagram slide template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0F3D3E; --accent:#F2B33D; --on-accent:#0B2B2C; --muted:rgba(255,255,255,.8); --line:rgba(255,255,255,.2); --box:rgba(255,255,255,.07); --bad:#F49A8E; }
  *{box-sizing:border-box}
  body{margin:0;background:#1b1b1b}
  body.preview{padding:40px;display:flex;flex-wrap:wrap;gap:40px}
  body.preview .slide{transform:scale(.4);transform-origin:top left;margin:0 -648px -810px 0}
  .slide{width:1080px;height:1350px;padding:80px;background:var(--bg);color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:22px}
  .kicker{font-weight:700;letter-spacing:3px;color:var(--accent)}
  .count{font-weight:600;color:rgba(255,255,255,.7)}
  .display{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-2px;line-height:1;margin:0}
  .acc{color:var(--accent)}
  .ar{font-family:Tajawal,sans-serif;direction:rtl;text-align:right}
  .muted{color:var(--muted)}
  .pill{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:14px 28px;font-weight:700}
  .tip{margin-top:auto;border:1px solid var(--line);background:var(--box);border-radius:22px;padding:28px 32px;display:flex;gap:20px;align-items:flex-start;font-size:28px;line-height:1.4}
  .tip b{flex:0 0 auto;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:6px 16px;font-size:22px}
  .bignum{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:180px;line-height:.8;color:var(--accent)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:24px}
  .list-item{padding:28px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .list-item:first-child{border-top:1px solid var(--line)}
  .card{background:var(--box);border:1px solid var(--line);border-radius:22px;padding:28px 32px}
  .cta{margin-top:auto;background:var(--accent);color:var(--on-accent);border-radius:26px;padding:30px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px}
  .opt{display:flex;gap:24px;align-items:center;border:2px solid var(--line);border-radius:22px;padding:28px 32px;font-size:40px;font-weight:600}
  .opt span{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px}
  .shot{margin-top:40px;flex:1;border-radius:22px;border:1px solid var(--line);background:var(--box) center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Usage
   Preview a whole post:   template.html?post=<id>
   Render one slide:       template.html?post=<id>&slide=<1-based index>   → screenshot the .slide element (1080×1350)
   The page sets window.__ready = true when fonts and images are loaded.  Serve the folder over http (e.g. python3 -m http.server). */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BRAND = {};

const topBar = (ctx) => `<div class="top"><span class="kicker">${esc(ctx.kicker||'')}</span>${ctx.total>1?`<span class="count">${ctx.index} / ${ctx.total}</span>`:''}</div>`;

const R = {
  cover: (s,c) => `${topBar(c)}
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:28px">
      <h1 class="display" style="font-size:120px">${esc(s.title)}<br><span class="acc">${esc(s.titleAccent)}</span></h1>
      ${s.ar?`<p class="ar" style="margin:0;font-weight:800;font-size:56px">${esc(s.ar)}</p>`:''}
    </div>
    <div class="row" style="margin-top:64px;font-size:26px;font-weight:600"><span class="muted">${esc(s.footer||'')}</span>${c.total>1?'<span class="pill">Swipe →</span>':''}</div>`,

  phrase: (s,c) => `${topBar(c)}
    <div style="margin:auto 0;display:flex;flex-direction:column">
    <div class="bignum">${s.n}</div>
    <h2 class="display" style="margin-top:40px;font-size:88px;line-height:1.05">${esc(s.en)}</h2>
    <p class="muted" style="margin:28px 0 0;font-size:32px">${esc(s.use)}</p>
    ${s.ar?`<p class="ar" style="margin:36px 0 0;font-weight:700;font-size:50px">${esc(s.ar)}</p>`:''}
    </div>
    ${s.tip?`<div class="tip" style="margin-top:0"><b>TIP</b><span>${esc(s.tip)}</span></div>`:''}`,

  mistake: (s,c) => `${topBar(c)}
    <div style="margin:auto 0;display:flex;flex-direction:column">
    <div class="bignum">${s.n}</div>
    <div style="margin-top:44px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;gap:20px;align-items:baseline;font-size:60px;font-weight:600;color:var(--bad)"><span>✗</span><span style="text-decoration:line-through;text-decoration-thickness:4px">${esc(s.wrong)}</span></div>
      <div style="display:flex;gap:20px;align-items:baseline"><span style="font-size:72px;color:var(--accent);font-weight:700">✓</span><h2 class="display acc" style="font-size:96px;line-height:1.05">${esc(s.right)}</h2></div>
    </div>
    ${s.ar?`<p class="ar" style="margin:44px 0 0;font-weight:700;font-size:46px">${esc(s.ar)}</p>`:''}
    </div>
    <div class="tip" style="margin-top:0"><b>WHY</b><span>${esc(s.why)}</span></div>`,

  list: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:80px;font-size:80px">${esc(s.title)}</h2>
    <div style="margin-top:48px">${s.items.map(([en,ar])=>`<div class="list-item"><div style="font-size:44px;font-weight:700;line-height:1.2">${esc(en)}</div>${ar?`<div class="ar muted" style="font-size:36px;font-weight:500">${esc(ar)}</div>`:''}</div>`).join('')}</div>`,

  steps: (s,c) => `${topBar(c)}
    <div style="margin-top:80px;display:flex;flex-direction:column;gap:28px">${s.items.map(([t,min,txt],i)=>`
      <div class="card" style="display:flex;gap:28px;align-items:flex-start">
        <span style="flex:0 0 auto;width:80px;height:80px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px">${(s.start||1)+i}</span>
        <div style="display:flex;flex-direction:column;gap:8px"><div class="row"><span style="font-size:40px;font-weight:700">${esc(t)}</span><span class="acc" style="font-size:28px;font-weight:700">${esc(min)}</span></div><span class="muted" style="font-size:30px;line-height:1.4">${esc(txt)}</span></div>
      </div>`).join('')}</div>`,

  rule: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:80px;font-size:76px">${esc(s.title)}</h2>
    <div style="margin-top:48px">${s.rows.map(([a,b])=>`<div class="list-item" style="flex-direction:row;justify-content:space-between;align-items:center;gap:24px"><span style="font-size:40px;font-weight:600">${esc(a)}</span><span class="acc" style="font-size:44px;font-weight:700;text-align:right">${esc(b)}</span></div>`).join('')}</div>
    ${s.examples?`<div class="card" style="margin-top:auto;font-size:34px;line-height:1.6">${s.examples.map(esc).join('<br>')}</div>`:''}`,

  compare: (s,c) => `${topBar(c)}
    <div style="margin-top:80px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:28px;font-weight:700;letter-spacing:1px">
      <div class="card acc">${esc(s.left)}</div><div class="card" style="color:#fff">${esc(s.right)}</div></div>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:20px">${s.rows.map(([a,b])=>`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="card" style="font-size:36px;line-height:1.3">${esc(a)}</div><div class="card" style="font-size:36px;line-height:1.3;border-color:var(--accent)">${esc(b)}</div></div>`).join('')}</div>`,

  quiz: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:100px;font-size:${s.options?96:80}px;line-height:1.05">${esc(s.question)}</h2>
    ${s.ar?`<p class="ar muted" style="margin:24px 0 0;font-size:44px;font-weight:700">${esc(s.ar)}</p>`:''}
    ${s.options?`<div style="margin-top:56px;display:flex;flex-direction:column;gap:22px">${s.options.map((o,i)=>`<div class="opt"><span>${'ABCD'[i]}</span>${esc(o)}</div>`).join('')}</div>`:''}
    ${s.lines?`<div style="margin-top:56px;display:flex;flex-direction:column;gap:30px">${s.lines.map(l=>`<div style="font-size:44px;font-weight:600;line-height:1.3">${esc(l)}</div>`).join('')}</div>`:''}
    <div class="row" style="margin-top:auto;font-size:30px;font-weight:700"><span class="acc">${esc(s.footer||'')}</span></div>`,

  answers: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:100px;font-size:96px">Answers</h2>
    <div style="margin-top:56px;display:flex;flex-direction:column;gap:28px">${s.items.map(a=>`<div class="card acc" style="font-size:52px;font-weight:700">${esc(a)}</div>`).join('')}</div>
    <p class="muted" style="margin-top:auto;font-size:30px">How many did you get right? Tell me in the comments.</p>`,

  cta: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:120px;font-size:100px;line-height:1.02">${esc(s.title)}<br><span class="acc">${esc(s.titleAccent)}</span></h2>
    ${s.ar?`<p class="ar" style="margin:32px 0 0;font-weight:800;font-size:52px">${esc(s.ar)}</p>`:''}
    <p class="muted" style="margin:32px 0 0;font-size:32px;line-height:1.45">${esc(s.body)}</p>
    <div class="muted" style="margin-top:24px;font-size:26px;font-weight:600">${esc(s.meta||'')}</div>
    <div class="cta">
      <div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:24px;font-weight:700">Message me on WhatsApp</div>
      <div class="display" style="font-size:64px;letter-spacing:1px">${esc(s.phone||BRAND.whatsapp||'')}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:22px;font-weight:700"><span>Save</span><span>Share</span><span>Follow</span></div>
    </div>`,

  screenshot: (s,c) => `${topBar(c)}
    <h2 class="display" style="margin-top:60px;font-size:72px">${esc(s.title)}</h2>
    <p class="muted" style="margin:20px 0 0;font-size:32px">${esc(s.text||'')}</p>
    <div class="shot">${s.image?`<img src="${esc(s.image)}" alt="">`:'Screenshot here'}</div>`
};

function slideHTML(post, i){
  const s = post.slides[i];
  const ctx = {index:i+1, total:post.slides.length, kicker:post.kicker};
  const fn = R[s.type];
  if(!fn) throw new Error('Unknown slide type: '+s.type);
  return `<section class="slide" data-post="${esc(post.id)}" data-slide="${i+1}">${fn(s,ctx)}</section>`;
}

/* Programmatic use (e.g. from Playwright): await page.evaluate(([post,i]) => renderSlide(post,i), [post, 0]) */
window.renderSlide = async (post, i, brand) => {
  if(brand) applyBrand(brand);
  document.getElementById('root').innerHTML = slideHTML(post, i);
  await waitAssets(); window.__ready = true;
};

function applyBrand(b){
  BRAND = b || {};
  const r = document.documentElement.style;
  if(b.bg) r.setProperty('--bg', b.bg);
  if(b.accent) r.setProperty('--accent', b.accent);
  if(b.onAccent) r.setProperty('--on-accent', b.onAccent);
}
async function waitAssets(){
  await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
}

(async () => {
  const q = new URLSearchParams(location.search);
  if(!q.get('post')) return;
  const data = await (await fetch(q.get('data') || 'posts.json')).json();
  applyBrand(data.brand);
  const post = data.posts.find(p => p.id === q.get('post'));
  if(!post || !post.slides) { document.body.textContent = 'Post not found or has no slides (reels are filmed).'; return; }
  const root = document.getElementById('root');
  if(q.get('slide')) root.innerHTML = slideHTML(post, +q.get('slide') - 1);
  else { document.body.classList.add('preview'); root.style.display='contents'; root.innerHTML = post.slides.map((_,i)=>slideHTML(post,i)).join(''); }
  await waitAssets(); window.__ready = true;
})();
</script>
</body>
</html>
